# Copy a GitHub Actions secret into this project's Vercel env — WITHOUT ever
# printing the value. GitHub secrets are write-only from the outside; the only
# thing that can read one is a workflow, so this is the sanctioned way to move a
# key (e.g. RINGBA_API_TOKEN) from GitHub → Vercel.
#
# Run:
#   gh workflow run sync-secret-to-vercel.yml -f name=RINGBA_API_TOKEN -f targets=production,preview
#
# Verify afterwards:  vercel env ls | grep RINGBA_API_TOKEN
#
# The log shows only the value's length and a sha256 fingerprint (first 12 hex),
# so you can compare against `sha256sum` of a locally known copy if needed.
name: Sync secret to Vercel

on:
  workflow_dispatch:
    inputs:
      name:
        description: "GitHub secret name to copy (must already exist in repo secrets)"
        required: true
        default: "RINGBA_API_TOKEN"
      targets:
        description: "Comma-separated Vercel targets: production,preview,development"
        required: false
        default: "production,preview"
      type:
        description: "Vercel env var type"
        required: false
        default: "encrypted"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_JRdKsTQV9jopaKxc8wlsdvGz
      VERCEL_PROJECT_ID: prj_LIvg3Gu0WLw6fhgBAivjIojFR4y9
      SECRET_NAME: ${{ inputs.name }}
      # Dynamic secret lookup by name — the value is masked in logs by GitHub.
      SECRET_VALUE: ${{ secrets[inputs.name] }}
      TARGETS: ${{ inputs.targets }}
      VAR_TYPE: ${{ inputs.type }}
    steps:
      - name: Upsert into Vercel env
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SECRET_VALUE}" ]; then
            echo "::error::GitHub secret '${SECRET_NAME}' is empty or does not exist."
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret is missing."
            exit 1
          fi

          # Fingerprint only — never the value.
          len=${#SECRET_VALUE}
          fp=$(printf '%s' "$SECRET_VALUE" | sha256sum | cut -c1-12)
          echo "Copying '${SECRET_NAME}' (len=${len}, sha256=${fp}…) → Vercel [${TARGETS}]"

          # Build JSON target array from the comma list.
          target_json=$(printf '%s' "$TARGETS" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' \
            | jq -R . | jq -cs .)

          body=$(jq -cn \
            --arg key "$SECRET_NAME" \
            --arg value "$SECRET_VALUE" \
            --arg type "$VAR_TYPE" \
            --argjson target "$target_json" \
            '{key:$key, value:$value, type:$type, target:$target}')

          resp=$(printf '%s' "$body" | curl -sS -w '\n%{http_code}' \
            -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @-)
          code=$(printf '%s' "$resp" | tail -n1)
          json=$(printf '%s' "$resp" | sed '$d')

          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Vercel API returned HTTP ${code}"
            # Error bodies don't echo the value; safe to print.
            printf '%s\n' "$json" | jq . 2>/dev/null || printf '%s\n' "$json"
            exit 1
          fi

          # Print the created/updated record minus the value field.
          printf '%s\n' "$json" | jq '{created: (.created // null | if . then {key, target, type, updatedAt} else null end), failed: (.failed // [])}'
          echo "✅ ${SECRET_NAME} is now set in Vercel for: ${TARGETS}"
